name: Version Gate

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'package.json'

concurrency:
  group: version-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check VERSION is not stale vs queue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Read versions
        id: versions
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          PR_VERSION=$(tr -d '[:space:]' < VERSION)
          git fetch origin "$BASE_REF" --depth=1 --quiet || true
          BASE_VERSION=$(git show "origin/$BASE_REF:VERSION" 2>/dev/null | tr -d '[:space:]' || echo "0.0.0.0")
          {
            echo "pr_version=$PR_VERSION"
            echo "base_version=$BASE_VERSION"
            echo "base_ref=$BASE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Detect bump level
        id: bump
        env:
          BASE_VERSION: ${{ steps.versions.outputs.base_version }}
          PR_VERSION: ${{ steps.versions.outputs.pr_version }}
        run: |
          LEVEL=$(bun run scripts/detect-bump.ts "$BASE_VERSION" "$PR_VERSION")
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Query queue (util) — fail-open on error
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ steps.versions.outputs.base_ref }}
          BUMP_LEVEL: ${{ steps.bump.outputs.level }}
          BASE_VERSION: ${{ steps.versions.outputs.base_version }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set +e
          bun run bin/gstack-next-version \
            --base "$BASE_REF" \
            --bump "$BUMP_LEVEL" \
            --current-version "$BASE_VERSION" \
            --workspace-root null \
            --exclude-pr "$PR_NUM" \
            > next.json 2> next.err
          RC=$?
          if [ "$RC" != "0" ] || [ ! -s next.json ]; then
            echo '{"offline":true}' > next.json
            echo "::warning::util exit=$RC — failing open. stderr:"
            cat next.err || true
          fi

      - name: Compare PR VERSION to next free slot
        env:
          PR_VERSION: ${{ steps.versions.outputs.pr_version }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          bun run scripts/compare-pr-version.ts next.json "$PR_NUM"
